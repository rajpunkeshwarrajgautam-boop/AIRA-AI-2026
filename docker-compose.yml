version: '3.8'

services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aira}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aira}
      POSTGRES_DB: ${POSTGRES_DB:-aira_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
