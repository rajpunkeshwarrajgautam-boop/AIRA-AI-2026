name: Aira Bot verification
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aira
          POSTGRES_PASSWORD: aira
          POSTGRES_DB: aira_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aira -d aira_db"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck:api
      - run: npm run lint
      - run: node --check docker/aira-computer/runner.mjs
      - run: node --check docker/aira-computer/action-journal.mjs
      - run: npm run test:bot:isolation
      - run: npm run test:bot:orchestration
      - run: npm run test:bot:skills-connectors
      - run: |
          for attempt in 1 2 3 4 5; do
            echo "Worker lease certification attempt ${attempt}/5"
            npm run test:bot:worker-leases
          done
      - run: |
          for attempt in 1 2 3 4 5; do
            echo "Distributed foundation certification attempt ${attempt}/5"
            npm run test:bot:distributed-runtime
          done
      - run: npx playwright install --with-deps chromium
      - run: npm run test:bot:live-runtime
      - run: docker build -t aira-computer:certified docker/aira-computer
      - run: npm run test:bot:live-runtime
        env:
          AIRA_TEST_USE_DOCKER_RUNNER: 'true'
      - run: npm run test:bot:computer
      - run: npm run test:bot:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aira-bot-browser-review
          path: /tmp/aira-bot-review
          if-no-files-found: ignore
