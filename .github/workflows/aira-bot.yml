name: Aira Bot verification
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck:api
      - run: npm run lint
      - run: npx playwright install --with-deps chromium
      - run: npm run test:bot:computer
      - run: npm run test:bot:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aira-bot-browser-review
          path: /tmp/aira-bot-review
          if-no-files-found: ignore
