name: Staging Billing Outbox Worker Scheduler

on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Batch size for outbox task processing (max 25)"
        required: false
        default: "10"
      environment_target:
        description: "Target environment to process (must match staging/sandbox)"
        required: false
        default: "sandbox"

permissions:
  contents: read

jobs:
  trigger-outbox-worker:
    name: Trigger Staging Outbox Worker
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Invoke Staging Outbox Worker
        env:
          WORKER_KEY: ${{ secrets.AIRA_INTERNAL_WORKER_KEY }}
          STAGING_URL: "https://staging.virexaaiventures.com"
          RAW_BATCH_SIZE: ${{ inputs.batch_size }}
          RAW_ENV_TARGET: ${{ inputs.environment_target }}
        run: |
          if [ -z "$WORKER_KEY" ]; then
            echo "ERROR: AIRA_INTERNAL_WORKER_KEY secret is not configured in repository secrets."
            exit 1
          fi

          # 1. Validate fixed staging environment target
          ENV_TARGET="sandbox"
          if [ -n "$RAW_ENV_TARGET" ]; then
            if [ "$RAW_ENV_TARGET" = "sandbox" ] || [ "$RAW_ENV_TARGET" = "staging" ]; then
              ENV_TARGET="$RAW_ENV_TARGET"
            else
              echo "ERROR: Invalid environment_target '$RAW_ENV_TARGET'. Must be strictly 'sandbox' or 'staging'."
              exit 1
            fi
          fi

          # 2. Validate numeric batch size and clamp to safe budget (1..25, default 10)
          BATCH_SIZE=10
          if [ -n "$RAW_BATCH_SIZE" ]; then
            if ! [[ "$RAW_BATCH_SIZE" =~ ^[0-9]+$ ]]; then
              echo "ERROR: batch_size must be a positive integer."
              exit 1
            fi
            if [ "$RAW_BATCH_SIZE" -gt 25 ]; then
              echo "WARNING: batch_size $RAW_BATCH_SIZE exceeds maximum limit (25). Clamping to 25."
              BATCH_SIZE=25
            elif [ "$RAW_BATCH_SIZE" -lt 1 ]; then
              BATCH_SIZE=1
            else
              BATCH_SIZE="$RAW_BATCH_SIZE"
            fi
          fi

          # 3. Construct JSON payload safely without shell interpolation
          PAYLOAD=$(printf '{"batchSize":%d,"budgetMs":9000}' "$BATCH_SIZE")

          echo "Triggering staging outbox worker at ${STAGING_URL}/api/billing/worker/process-outbox (target: ${ENV_TARGET}, batch: ${BATCH_SIZE})..."
          HTTP_STATUS=$(curl -s -o worker-response.json -w "%{http_code}" \
            -X POST "${STAGING_URL}/api/billing/worker/process-outbox" \
            -H "Content-Type: application/json" \
            -H "x-internal-worker-key: ${WORKER_KEY}" \
            -H "x-environment-target: ${ENV_TARGET}" \
            -d "${PAYLOAD}")

          echo "Worker response status: ${HTTP_STATUS}"
          cat worker-response.json
          echo ""

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Worker execution failed with HTTP ${HTTP_STATUS}"
            exit 1
          fi
