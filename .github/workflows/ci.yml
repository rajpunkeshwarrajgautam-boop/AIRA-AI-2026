name: CI

on:
  push:
  pull_request:
    branches: [main, prod-release]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  DATABASE_URL: postgres://aira:aira@127.0.0.1:5432/aira_db
  NODE_ENV: test

jobs:
  fast:
    name: Fast CI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: aira
          POSTGRES_PASSWORD: aira
          POSTGRES_DB: aira_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U aira -d aira_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Scan tracked files for high-risk credential patterns
        shell: bash
        run: |
          set -euo pipefail
          pattern='(nvapi-[A-Za-z0-9_-]{20,}|sk-ant-[A-Za-z0-9_-]{20,}|sk_live_[A-Za-z0-9_-]{20,}|gh[pousr]_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16})'
          if git grep -IlE "$pattern" -- . ':(exclude)package-lock.json' > /tmp/secret-files; then
            echo '::error::Potential credential material found in tracked files:'
            sed 's/^/ - /' /tmp/secret-files
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Run database migrations
        run: npm run db:migrate

      - name: Verify deploy database contract (lexical fallback)
        env:
          AIRA_SEMANTIC_SEARCH: 'false'
        run: npm run db:verify:deploy

      - name: Runtime verification
        run: npm test

      - name: Model provider routing certification
        run: npm run test:model-routing

      - name: Math typesetting and sanitization regression
        run: npm run test:math-rendering

      - name: Preview principal spoofing guard
        run: npm run test:preview-identity

      - name: Router and policy verification
        run: npm run test:router

      - name: Workflow engine verification
        run: npm run test:workflow

      - name: Tool gateway certification
        run: npm run test:tools

      - name: Browser execution suite
        run: npm run test:browser

      - name: Search provider failover certification (mocked)
        run: npm run test:search

      - name: Research evidence grounding regression
        run: npm run test:research-evidence

      - name: Conversation search certification
        run: npm run test:conversation-search

      - name: Search timeout and cancellation regression
        run: npm run test:conversation-search-client

      - name: Long-prompt persistence regression
        run: npm run test:long-prompt-persistence

      - name: Memory context regression certification
        run: npm run test:memory-context

      - name: Embedding provider regression certification
        run: npm run test:embedding-provider

      - name: Capability reality audit suite
        run: npm run test:reality

      - name: Behavioral intelligence regression suite
        run: npm run test:behavioral

      - name: Behavioral intelligence security suite
        run: npm run test:behavioral:security

      - name: Behavioral intelligence precedence regression
        run: npm run test:behavioral:precedence

      - name: Behavioral intelligence 120-scenario benchmark
        run: npm run test:behavioral:benchmark


  semantic-search:
    name: Semantic Search CI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: aira
          POSTGRES_PASSWORD: aira
          POSTGRES_DB: aira_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U aira -d aira_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run database migrations with pgvector
        run: npm run db:migrate

      - name: Verify deploy database contract (semantic)
        run: npm run db:verify:deploy

      - name: Semantic conversation search certification
        run: npm run test:conversation-search-semantic


  certify:
    name: Main / PR certification
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/prod-release'
    needs: [fast, semantic-search]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: aira
          POSTGRES_PASSWORD: aira
          POSTGRES_DB: aira_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U aira -d aira_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run database migrations
        run: npm run db:migrate

      - name: Verify deploy database contract (lexical fallback)
        env:
          AIRA_SEMANTIC_SEARCH: 'false'
        run: npm run db:verify:deploy

      - name: Integration certification
        run: npm run test:integration

      - name: Recovery certification
        run: npm run test:recovery

      - name: Identity certification
        run: npm run test:identity

      - name: Browser session bridge certification
        run: npm run test:session-auth

      - name: Startup certification
        run: npm run test:startup

      - name: Install Playwright Edge
        run: npx playwright install --with-deps msedge

      - name: Start Vite for E2E
        shell: bash
        run: |
          set -euo pipefail
          npm run dev -- --host 127.0.0.1 > /tmp/aira-vite.log 2>&1 &
          echo $! > /tmp/aira-vite.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:5173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/aira-vite.log
          exit 1

      - name: Mobile chat, model menu and welcome regression
        run: npx tsx test/mobile-chat-welcome-responsive.ts

      - name: E2E certification
        run: npm run test:e2e

      - name: Mobile sidebar responsive acceptance
        run: npm run test:mobile-sidebar

      - name: Settings modal responsive acceptance
        run: npm run test:mobile-settings

      - name: Stop Vite
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/aira-vite.pid ]; then
            kill "$(cat /tmp/aira-vite.pid)" 2>/dev/null || true
          fi

      - name: Upload E2E server log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: aira-ci-e2e-log
          path: /tmp/aira-vite.log
          if-no-files-found: ignore
