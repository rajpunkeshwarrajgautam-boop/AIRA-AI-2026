name: Workspace V3 dependency lockfile (temporary)
on:
  push:
    branches: [feat/workspace-v3-staging-20261114]
    paths:
      - .github/workflows/workspace-v3-lockfile.yml
permissions:
  contents: write
jobs:
  update-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Resolve version and lockfile without running lifecycle scripts
        run: npm install 'react-virtuoso@^4.14.0' --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit dependency manifest and lockfile to isolated feature branch only
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'feat/workspace-v3-staging-20261114'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore(workspace-v3): lock react-virtuoso dependency'
            git push origin HEAD:refs/heads/feat/workspace-v3-staging-20261114
          fi
