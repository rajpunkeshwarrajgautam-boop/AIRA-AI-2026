name: Release Authorization Attestation (No Deployment)
run-name: "Release Authorization: PR #${{ inputs.pr_number }} [${{ inputs.candidate_sha }}] [${{ inputs.approval_phrase }}]"

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Number of the release pull request"
        required: true
        type: string
      candidate_sha:
        description: "Exact full 40-character PR head SHA"
        required: true
        type: string
      approval_phrase:
        description: "Type GO LIVE followed by one space and the candidate SHA"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: release-auth-${{ inputs.pr_number }}
  cancel-in-progress: true

jobs:
  attestation:
    name: Human Production Authorization (Attestation Only)
    runs-on: ubuntu-latest
    if: github.actor == github.repository_owner
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ inputs.pr_number }}
      EXPECTED_SHA: ${{ inputs.candidate_sha }}
      APPROVAL_PHRASE: ${{ inputs.approval_phrase }}
    steps:
      - name: Initialize pending status on candidate commit
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Posting interim pending status on candidate $EXPECTED_SHA..."
            gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$EXPECTED_SHA" \
              -f state="pending" \
              -f context="release/go-live-authorized" \
              -f description="Attestation verification in progress by $GITHUB_ACTOR for PR #$PR_NUMBER" \
              -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" || true
          fi

      - name: Verify explicit release approval and exact PR head
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::Expected a full 40-character commit SHA"; exit 1;
          }
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]] || {
            echo "::error::Expected a numeric pull request number"; exit 1;
          }
          [[ "$APPROVAL_PHRASE" == "GO LIVE $EXPECTED_SHA" ]] || {
            echo "::error::Explicit exact-commit GO LIVE phrase is required"; exit 1;
          }
          PR_JSON=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")
          ACTUAL_SHA=$(jq -r '.head.sha' <<<"$PR_JSON")
          TARGET_BRANCH=$(jq -r '.base.ref' <<<"$PR_JSON")
          STATE=$(jq -r '.state' <<<"$PR_JSON")
          [[ "$ACTUAL_SHA" == "$EXPECTED_SHA" ]] || {
            echo "::error::Release candidate SHA changed"; exit 1;
          }
          [[ "$TARGET_BRANCH" == "prod-release" && "$STATE" == "open" ]] || {
            echo "::error::PR must be an open release candidate into prod-release"; exit 1;
          }

          # Post tamper-resistant commit status bound strictly to candidate SHA only upon full verification pass
          echo "Posting verified commit status release/go-live-authorized on $EXPECTED_SHA..."
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$EXPECTED_SHA" \
            -f state="success" \
            -f context="release/go-live-authorized" \
            -f description="Explicit owner GO LIVE verified by $GITHUB_ACTOR for PR #$PR_NUMBER" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

          {
            printf '%s\n' '### AIRA Production Authorization — Attestation & Status Emitted'
            printf '%s\n' "- Approved by GitHub actor: \`$GITHUB_ACTOR\`"
            printf '%s\n' "- Repository: \`$GITHUB_REPOSITORY\`"
            printf '%s\n' "- PR: #$PR_NUMBER"
            printf '%s\n' "- Candidate SHA: \`$EXPECTED_SHA\`"
            printf '%s\n' '- Target branch: `prod-release`'
            printf '%s\n' '- Status context: `release/go-live-authorized` → **success**'
            printf '%s\n' "- UTC time: \`$(date -u +'%Y-%m-%dT%H:%M:%SZ')\`"
            printf '%s\n' ''
            printf '%s\n' '**This workflow does not change production.** It does not merge,'
            printf '%s\n' 'modify secrets, apply migrations, or promote a deployment.'
            printf '%s\n' 'Release actors must separately check required CI and live'
            printf '%s\n' 'staging evidence, then obtain current user authorization.'
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Mark status failed on attestation abort, failure, or cancellation
        if: failure() || cancelled()
        shell: bash
        run: |
          if [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Attestation step failed or cancelled; posting failure status on $EXPECTED_SHA..."
            gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$EXPECTED_SHA" \
              -f state="failure" \
              -f context="release/go-live-authorized" \
              -f description="Authorization attestation failed or cancelled for PR #$PR_NUMBER" \
              -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" || true
          fi
