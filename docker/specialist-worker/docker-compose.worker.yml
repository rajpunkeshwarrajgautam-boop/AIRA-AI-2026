version: '3.8'

services:
  specialist-worker:
    build:
      context: ../..
      dockerfile: docker/specialist-worker/Dockerfile
    image: ghcr.io/rajpunkeshwarrajgautam-boop/aira-specialist-worker:latest
    container_name: aira-specialist-worker
    restart: unless-stopped
    user: "10001:10001"
    environment:
      - NODE_ENV=production
      - AIRA_SPECIALIST_WORKER_PROCESS=true
      - AIRA_SPECIALIST_WORKER_ENABLED=true
      - AIRA_SPECIALIST_DELEGATION_ENABLED=true
      - DATABASE_URL=${DATABASE_URL}
      - AIRA_AGENT_PLAN_SIGNING_KEY=${AIRA_AGENT_PLAN_SIGNING_KEY}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - PORT=8080
      - WORKER_HEALTH_HOST=0.0.0.0
      - WORKER_HEALTH_ALLOW_EXTERNAL=true
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1536M
        reservations:
          cpus: '0.25'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
