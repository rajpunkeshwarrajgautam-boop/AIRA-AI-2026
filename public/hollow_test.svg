<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Facet 1: Main illuminated ribbon surface -->
    <linearGradient id="ribbonFace" x1="22" y1="8" x2="42" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F5A384"/>
      <stop offset="50%" stop-color="#D97757"/>
      <stop offset="100%" stop-color="#B24628"/>
    </linearGradient>

    <!-- Facet 2: Inner shadow fold (gives Manus-style 3D mobius depth) -->
    <linearGradient id="ribbonInnerFold" x1="26" y1="12" x2="38" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C15335"/>
      <stop offset="100%" stop-color="#7A2814"/>
    </linearGradient>

    <!-- Specular rim highlight -->
    <linearGradient id="rimHighlight" x1="32" y1="8" x2="32" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Overlap drop shadow filter for genuine dimensional weaving -->
    <filter id="knotShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Dark preview backdrop -->
  <rect width="64" height="64" rx="14" fill="#0E131F"/>

  <!-- Center subtle ambient glow -->
  <circle cx="32" cy="34" r="16" fill="#D97757" fill-opacity="0.12" filter="blur(8px)"/>

  <!-- Loop 3: Left leg (240 deg) -->
  <g transform="rotate(240 32 34)" filter="url(#knotShadow)">
    <!-- Outer ribbon body -->
    <path
      d="M 28 36 C 24 30 22 22 25 15 C 27 10 37 10 39 15 C 42 22 40 30 36 36 C 34 39 30 39 28 36 Z"
      fill="url(#ribbonFace)"
    />
    <!-- Inner hollow cutout (ChatGPT open negative space!) -->
    <path
      d="M 30.5 31 C 28.5 27 27.5 21 29 17 C 30 14 34 14 35 17 C 36.5 21 35.5 27 33.5 31 C 32.5 33 31.5 33 30.5 31 Z"
      fill="#0E131F"
    />
    <!-- Inner 3D bevel fold (Manus dimensional ribbon) -->
    <path
      d="M 25 15 C 27 10 37 10 39 15 C 37 13 27 13 25 15 Z"
      fill="url(#rimHighlight)"
    />
  </g>

  <!-- Loop 2: Right leg (120 deg) -->
  <g transform="rotate(120 32 34)" filter="url(#knotShadow)">
    <path
      d="M 28 36 C 24 30 22 22 25 15 C 27 10 37 10 39 15 C 42 22 40 30 36 36 C 34 39 30 39 28 36 Z"
      fill="url(#ribbonFace)"
    />
    <path
      d="M 30.5 31 C 28.5 27 27.5 21 29 17 C 30 14 34 14 35 17 C 36.5 21 35.5 27 33.5 31 C 32.5 33 31.5 33 30.5 31 Z"
      fill="#0E131F"
    />
    <path
      d="M 25 15 C 27 10 37 10 39 15 C 37 13 27 13 25 15 Z"
      fill="url(#rimHighlight)"
    />
  </g>

  <!-- Loop 1: Top Apex (0 deg - points UP, forming the crest of the 'A') -->
  <g transform="rotate(0 32 34)" filter="url(#knotShadow)">
    <path
      d="M 28 36 C 24 30 22 22 25 15 C 27 10 37 10 39 15 C 42 22 40 30 36 36 C 34 39 30 39 28 36 Z"
      fill="url(#ribbonFace)"
    />
    <path
      d="M 30.5 31 C 28.5 27 27.5 21 29 17 C 30 14 34 14 35 17 C 36.5 21 35.5 27 33.5 31 C 32.5 33 31.5 33 30.5 31 Z"
      fill="#0E131F"
    />
    <path
      d="M 25 15 C 27 10 37 10 39 15 C 37 13 27 13 25 15 Z"
      fill="url(#rimHighlight)"
    />
  </g>

  <!-- Central Nexus Core -->
  <circle cx="32" cy="34" r="3" fill="#FFFFFF" fill-opacity="0.95"/>
</svg>